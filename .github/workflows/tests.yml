name: Compatibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        dependencies: [prefer-stable]
        exclude:
          - php: '8.2'
            laravel: '13.*'
        include:
          - php: '8.2'
            laravel: '11.*'
            dependencies: prefer-lowest
          - php: '8.2'
            laravel: '12.*'
            dependencies: prefer-lowest
          - php: '8.3'
            laravel: '13.*'
            dependencies: prefer-lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --with="illuminate/support:${{ matrix.laravel }}"

      - name: Run PHPUnit
        run: composer test
