name: Compatibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Testbench ${{ matrix.testbench }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            illuminate: '^12.61.1'
            testbench: '^10.0'
            dependencies: highest
          - php: '8.3'
            laravel: '12'
            illuminate: '^12.61.1'
            testbench: '^10.0'
            dependencies: highest
          - php: '8.4'
            laravel: '12'
            illuminate: '^12.61.1'
            testbench: '^10.0'
            dependencies: highest
          - php: '8.5'
            laravel: '12'
            illuminate: '^12.61.1'
            testbench: '^10.0'
            dependencies: highest
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.12.0'
            testbench: '^11.0'
            dependencies: highest
          - php: '8.4'
            laravel: '13'
            illuminate: '^13.12.0'
            testbench: '^11.0'
            dependencies: highest
          - php: '8.5'
            laravel: '13'
            illuminate: '^13.12.0'
            testbench: '^11.0'
            dependencies: highest
          - php: '8.2'
            laravel: '12'
            illuminate: '^12.61.1'
            testbench: '^10.0'
            dependencies: lowest
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.12.0'
            testbench: '^11.0'
            dependencies: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify lockless package repository
        run: |
          test ! -f composer.lock

          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "composer.lock must not be tracked for this library."
            exit 1
          fi

      - name: Select Laravel and Testbench pair
        run: |
          composer require --no-update \
            "illuminate/bus:${{ matrix.illuminate }}" \
            "illuminate/cache:${{ matrix.illuminate }}" \
            "illuminate/console:${{ matrix.illuminate }}" \
            "illuminate/contracts:${{ matrix.illuminate }}" \
            "illuminate/database:${{ matrix.illuminate }}" \
            "illuminate/queue:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}"
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Restore package manifest
        run: |
          git checkout -- composer.json
          rm -f composer.lock

      - name: Run PHPUnit
        run: composer test
