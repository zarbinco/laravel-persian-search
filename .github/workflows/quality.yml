name: Package quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.3 / Laravel 13 / Testbench 11 / highest quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Select Laravel 13 and Testbench 11
        run: |
          composer require --no-update \
            "illuminate/bus:^13.12.0" \
            "illuminate/cache:^13.12.0" \
            "illuminate/console:^13.12.0" \
            "illuminate/contracts:^13.12.0" \
            "illuminate/database:^13.12.0" \
            "illuminate/queue:^13.12.0" \
            "illuminate/support:^13.12.0"
          composer require --dev --no-update "orchestra/testbench:^11.0"

      - name: Install highest dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Check formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse -- --no-progress

      - name: Run PHPUnit
        run: composer test
